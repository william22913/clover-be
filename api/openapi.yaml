openapi: 3.0.3
info:
  title: clover-be
  version: 1.0.0
  description: |
    Clover v1. One Go service serves the JSON API, the static UI, the posters
    and the session-gated video stream.

    Every response carries `X-Request-Id`; every failure uses the single error
    envelope below. Authentication is the `clover_session` cookie issued by
    sign-up or sign-in (HttpOnly, Secure, SameSite=Lax, 7-day lifetime).
servers:
  - url: http://localhost:8080
    description: compose stack (local verification)
tags:
  - name: Catalogue
    description: Public catalogue controller — no session required.
  - name: Media
    description: Session-gated video controller and public image assets.
  - name: Auth
    description: Sign-up, sign-in, sign-out and the current account.
  - name: Health
    description: Liveness probe for the container platform.

paths:
  /v1/movies:
    get:
      tags: [Catalogue]
      operationId: listMovies
      summary: Every published film, in catalogue order
      description: >-
        One unpaginated list. No search, filter, sort or paging parameters
        exist; unknown query strings are ignored.
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieList"
        default:
          $ref: "#/components/responses/Error"
    options:
      tags: [Catalogue]
      operationId: preflightMovies
      summary: CORS preflight for the same-origin browser client
      responses:
        "204":
          $ref: "#/components/responses/Preflight"

  /v1/movies/{slug}:
    get:
      tags: [Catalogue]
      operationId: getMovie
      summary: One published film by slug
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The film
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "404":
          $ref: "#/components/responses/MovieNotFound"
        default:
          $ref: "#/components/responses/Error"
    options:
      tags: [Catalogue]
      operationId: preflightMovie
      summary: CORS preflight for the same-origin browser client
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "204":
          $ref: "#/components/responses/Preflight"

  /v1/movies/{slug}/video:
    get:
      tags: [Media]
      operationId: streamMovie
      summary: The film's MP4 stream, with byte-range support
      description: >-
        Requires a live session cookie. The filename comes from the database
        row, never from the URL. `Range` is answered with `206 Partial Content`
        and `Accept-Ranges: bytes` so playback starts before the whole file
        arrives and a seek is a new range request.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: Range
          in: header
          required: false
          schema:
            type: string
            example: bytes=0-1048575
      responses:
        "200":
          description: The whole file
          headers:
            Accept-Ranges:
              schema: { type: string, example: bytes }
            Cache-Control:
              schema: { type: string, example: private, no-store }
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: The requested byte range
          headers:
            Content-Range:
              schema: { type: string, example: bytes 0-1048575/715763 }
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/SessionExpired"
        "404":
          description: The film does not exist, or its file is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                movie_not_found:
                  value:
                    error:
                      code: movie_not_found
                      message: This film is not available.
                      request_id: 4f9c1e7a2b6d48c9a0de5b8f3c1d7e60
                video_unavailable:
                  value:
                    error:
                      code: video_unavailable
                      message: The film could not be loaded.
                      request_id: 4f9c1e7a2b6d48c9a0de5b8f3c1d7e60
        default:
          $ref: "#/components/responses/Error"
    options:
      tags: [Media]
      operationId: preflightVideo
      summary: CORS preflight for the same-origin browser client
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "204":
          $ref: "#/components/responses/Preflight"

  /v1/auth/sign-up:
    post:
      tags: [Auth]
      operationId: signUp
      summary: Create an account and sign in
      description: >-
        No email verification exists. The response sets the session cookie and
        returns the account. A duplicate email is `409 email_taken`; field
        rules are `422 validation_failed` with a `fields` map.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Account created and signed in
          headers:
            Set-Cookie:
              schema:
                type: string
                example: clover_session=…; Path=/; Max-Age=604800; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBody"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          description: The email already has an account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: email_taken
                  message: An account already uses this email. Sign in instead.
                  request_id: 4f9c1e7a2b6d48c9a0de5b8f3c1d7e60
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
    options:
      tags: [Auth]
      operationId: preflightSignUp
      summary: CORS preflight for the same-origin browser client
      responses:
        "204":
          $ref: "#/components/responses/Preflight"

  /v1/auth/sign-in:
    post:
      tags: [Auth]
      operationId: signIn
      summary: Sign in with the registered email and password
      description: >-
        Email matching is case-insensitive (surrounding whitespace is trimmed
        once); the password is compared byte-for-byte with no trim or case
        folding. Unknown email and wrong password return one byte-identical
        `401 invalid_credentials`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBody"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
    options:
      tags: [Auth]
      operationId: preflightSignIn
      summary: CORS preflight for the same-origin browser client
      responses:
        "204":
          $ref: "#/components/responses/Preflight"

  /v1/auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      summary: Revoke the presented session and clear the cookie
      description: Idempotent — a missing or already-revoked cookie is still 204.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              schema: { type: string }
        "403":
          $ref: "#/components/responses/InvalidRequest"
        default:
          $ref: "#/components/responses/Error"
    options:
      tags: [Auth]
      operationId: preflightSignOut
      summary: CORS preflight for the same-origin browser client
      responses:
        "204":
          $ref: "#/components/responses/Preflight"

  /v1/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The signed-in account
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBody"
        "401":
          $ref: "#/components/responses/SessionExpired"
        default:
          $ref: "#/components/responses/Error"
    options:
      tags: [Auth]
      operationId: preflightMe
      summary: CORS preflight for the same-origin browser client
      responses:
        "204":
          $ref: "#/components/responses/Preflight"

  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      summary: Database-backed liveness probe
      responses:
        "200":
          description: The service and its database answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database did not answer within the probe timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: clover_session

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: The film's catalogue slug (`^[a-z0-9-]{1,64}$`)
      schema:
        type: string
        pattern: "^[a-z0-9-]{1,64}$"
        example: halcyon

  schemas:
    Movie:
      type: object
      required: [slug, title, short_description, release_year, runtime_seconds, poster_url]
      properties:
        slug:
          type: string
          example: halcyon
        title:
          type: string
          example: Halcyon Bay
        short_description:
          type: string
        release_year:
          type: integer
          example: 2023
        runtime_seconds:
          type: integer
          example: 7560
        poster_url:
          type: string
          example: /media/poster/p-halcyon.jpg
        still_url:
          type: string
          nullable: true
          example: /media/still/still-halcyon.jpg
    MovieList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
    Credentials:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: viewer@example.com
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: >-
            At sign-up, at least 8 characters with at least one letter and one
            number; taken exactly as typed. At sign-in, only non-empty is
            required.
          example: Passw0rd1
    User:
      type: object
      required: [email]
      properties:
        email:
          type: string
          example: viewer@example.com
    UserBody:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - invalid_credentials
                - session_expired
                - movie_not_found
                - video_unavailable
                - not_found
                - method_not_allowed
                - email_taken
                - validation_failed
                - rate_limited
                - internal_error
            message:
              type: string
              description: English and safe to display; never carries internal detail.
            request_id:
              type: string
              description: Same value as the `X-Request-Id` response header.
            fields:
              type: object
              additionalProperties:
                type: string
              description: Present only on `validation_failed`.

  responses:
    Error:
      description: An error envelope
      headers:
        X-Request-Id:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: Malformed JSON, wrong content type or a body over 1 MiB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidCredentials:
      description: Unknown email or wrong password — one byte-identical body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SessionExpired:
      description: No cookie, or an unknown, expired or revoked session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MovieNotFound:
      description: The slug is not in the published catalogue
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Field rules rejected the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: More than 10 sign-in/sign-up attempts per minute from one address
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Preflight:
      description: No content; `Allow` lists the methods for this path
      headers:
        Allow:
          schema: { type: string, example: "GET, HEAD, OPTIONS" }
