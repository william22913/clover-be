# The Clover stack: PostgreSQL, the one-shot seed, the API, and (behind the
# "full" profile) the separately built browser app from ../clover-fe.
# The API serves JSON and media only; the frontend reverse-proxies /v1/ here.
name: clover

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clover}
      POSTGRES_DB: ${POSTGRES_DB:-clover}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seed:
    image: clover-be:local
    build: .
    entrypoint: ["/app/seed"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: &app_env
      DATABASE_URL: postgres://${POSTGRES_USER:-clover}:${POSTGRES_PASSWORD:-clover}@postgres:5432/${POSTGRES_DB:-clover}?sslmode=disable
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MEDIA_DIR: /app/media
      HTTP_ADDR: :8080
      METRICS_ADDR: :9090
      # The frontend proxy's exact address (or a range that contains only
      # proxies). Leave empty when the API is reached directly; with this set
      # wrongly, a peer inside it can choose its own rate-limit bucket.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}

  be:
    image: clover-be:local
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment: *app_env
    # Published for local checks only. In a shared deployment the frontend
    # proxy is the only entry point, so drop this mapping.
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The browser app is its own repository and its own image. It is not part of
  # the API's default stack; use `docker compose --profile full up`.
  fe:
    profiles: ["full"]
    build: ../clover-fe
    depends_on:
      be:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
